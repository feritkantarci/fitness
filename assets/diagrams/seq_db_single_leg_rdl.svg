<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="100%" height="auto" style="background:#090d16; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
<defs>
        <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#d97706"/>
        </linearGradient>
        <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f8fafc"/>
            <stop offset="100%" stop-color="#94a3b8"/>
        </linearGradient>
        <marker id="arrowCyan" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="#38bdf8"/>
        </marker>
        <marker id="arrowGold" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/>
        </marker>
        <marker id="arrowGreen" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="#10b981"/>
        </marker>
    </defs>

        <g transform="translate(12, 10)">
            <!-- Card background -->
            <rect width="240" height="210" rx="10" fill="#131c2e" stroke="#25334d" stroke-width="1.5"/>
            <!-- Badge -->
            <rect x="12" y="10" width="105" height="22" rx="4" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
            <text x="64" y="25" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">1. BAŞLANGIÇ</text>
            
            <!-- Graphic canvas area -->
            <g transform="translate(120, 95)">
                <line x1="-75" y1="48" x2="75" y2="48" stroke="#334155" stroke-width="2" stroke-dasharray="4,4" stroke-linecap="round"/>
                <!-- Supporting leg grounded -->
                <line x1="0" y1="45" x2="0" y2="10" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
                <!-- Non-supporting leg ready behind -->
                <line x1="-12" y1="42" x2="-2" y2="10" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-dasharray="3,2"/>
                <!-- Torso upright -->
                <line x1="0" y1="10" x2="0" y2="-22" stroke="url(#bodyGrad)" stroke-width="12" stroke-linecap="round"/>
                <circle cx="0" cy="-35" r="9" fill="#cbd5e1"/>
                <!-- Arms holding dumbbell -->
                <line x1="6" y1="-18" x2="6" y2="5" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
                <g transform="translate(6,6) rotate(0) scale(1.0)">
                    <rect x="-8" y="-2.5" width="16" height="5" rx="1.5" fill="#fde68a"/>
                    <rect x="-13" y="-7" width="5.5" height="14" rx="2" fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.5"/>
                    <rect x="7.5" y="-7" width="5.5" height="14" rx="2" fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.5"/>
                </g>
            </g>
            
            <!-- Step label & caption -->
            <text x="120" y="176" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">Tek Ayakta Denge</text>
            <text x="120" y="195" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Ağırlık tek ayakta, omuzlar dik, karın sıkı</text>
        </g>

        <g transform="translate(253, 105)">
            <circle cx="8" cy="0" r="9" fill="#1e293b" stroke="#334155" stroke-width="1"/>
            <path d="M6,-3 L10,0 L6,3" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <g transform="translate(270, 10)">
            <!-- Card background -->
            <rect width="240" height="210" rx="10" fill="#131c2e" stroke="#25334d" stroke-width="1.5"/>
            <!-- Badge -->
            <rect x="12" y="10" width="105" height="22" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
            <text x="64" y="25" fill="#f59e0b" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">2. ARA GEÇİŞ</text>
            
            <!-- Graphic canvas area -->
            <g transform="translate(120, 95)">
                <line x1="-75" y1="48" x2="75" y2="48" stroke="#334155" stroke-width="2" stroke-dasharray="4,4" stroke-linecap="round"/>
                <!-- Supporting leg: slight bend -->
                <polyline points="4,45 6,24 0,14" stroke="#64748b" stroke-width="6" stroke-linecap="round" fill="none"/>
                <!-- Rear leg extended back horizontally -->
                <line x1="0" y1="14" x2="-45" y2="12" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
                <!-- Torso hinged forward horizontally -->
                <line x1="0" y1="14" x2="26" y2="12" stroke="url(#bodyGrad)" stroke-width="12" stroke-linecap="round"/>
                <circle cx="34" cy="11" r="9" fill="#cbd5e1"/>
                <!-- Dumbbell hanging down near shin -->
                <line x1="18" y1="12" x2="18" y2="34" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
                <g transform="translate(18,36) rotate(0) scale(1.0)">
                    <rect x="-8" y="-2.5" width="16" height="5" rx="1.5" fill="#fde68a"/>
                    <rect x="-13" y="-7" width="5.5" height="14" rx="2" fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.5"/>
                    <rect x="7.5" y="-7" width="5.5" height="14" rx="2" fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.5"/>
                </g>
                <!-- Rear leg extension arrow -->
                <path d="M-30,12 L-48,12" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowGold)"/>
            </g>
            
            <!-- Step label & caption -->
            <text x="120" y="176" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">Arka Bacağı Uzatarak Menteşe</text>
            <text x="120" y="195" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Serbest bacak arkaya düz, sırt masa gibi</text>
        </g>

        <g transform="translate(511, 105)">
            <circle cx="8" cy="0" r="9" fill="#1e293b" stroke="#334155" stroke-width="1"/>
            <path d="M6,-3 L10,0 L6,3" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <g transform="translate(528, 10)">
            <!-- Card background -->
            <rect width="240" height="210" rx="10" fill="#131c2e" stroke="#25334d" stroke-width="1.5"/>
            <!-- Badge -->
            <rect x="12" y="10" width="105" height="22" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
            <text x="64" y="25" fill="#10b981" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">3. SON BİTİRİŞ</text>
            
            <!-- Graphic canvas area -->
            <g transform="translate(120, 95)">
                <line x1="-75" y1="48" x2="75" y2="48" stroke="#334155" stroke-width="2" stroke-dasharray="4,4" stroke-linecap="round"/>
                <!-- Supporting leg standing tall -->
                <line x1="0" y1="45" x2="0" y2="10" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
                <!-- Free leg balanced close -->
                <line x1="-10" y1="40" x2="-2" y2="10" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
                <!-- Torso upright and locked -->
                <line x1="0" y1="10" x2="0" y2="-22" stroke="url(#bodyGrad)" stroke-width="12" stroke-linecap="round"/>
                <circle cx="0" cy="-35" r="9" fill="#cbd5e1"/>
                <line x1="6" y1="-18" x2="6" y2="5" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
                <g transform="translate(6,6) rotate(0) scale(1.0)">
                    <rect x="-8" y="-2.5" width="16" height="5" rx="1.5" fill="#fde68a"/>
                    <rect x="-13" y="-7" width="5.5" height="14" rx="2" fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.5"/>
                    <rect x="7.5" y="-7" width="5.5" height="14" rx="2" fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.5"/>
                </g>
                <!-- Drive upward arrow -->
                <path d="M-6,25 L-6,15" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
            </g>
            
            <!-- Step label & caption -->
            <text x="120" y="176" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">Topuktan Doğrulma</text>
            <text x="120" y="195" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Hamstring & glute sıkı, dengede bitir</text>
        </g>
</svg>
