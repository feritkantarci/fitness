<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="100%" height="auto" style="background:#090d16; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
<defs>
        <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#d97706"/>
        </linearGradient>
        <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f8fafc"/>
            <stop offset="100%" stop-color="#94a3b8"/>
        </linearGradient>
        <marker id="arrowCyan" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="#38bdf8"/>
        </marker>
        <marker id="arrowGold" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/>
        </marker>
        <marker id="arrowGreen" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="#10b981"/>
        </marker>
    </defs>

        <g transform="translate(12, 10)">
            <!-- Card background -->
            <rect width="240" height="210" rx="10" fill="#131c2e" stroke="#25334d" stroke-width="1.5"/>
            <!-- Badge -->
            <rect x="12" y="10" width="105" height="22" rx="4" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
            <text x="64" y="25" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">1. BAŞLANGIÇ</text>
            
            <!-- Graphic canvas area -->
            <g transform="translate(120, 95)">
                
        <line x1="-75" y1="35" x2="75" y2="35" stroke="#334155" stroke-width="2" stroke-dasharray="4,4" stroke-linecap="round"/>
        <line x1="-40" y1="32" x2="30" y2="32" stroke="url(#bodyGrad)" stroke-width="10" stroke-linecap="round"/>
        <circle cx="38" cy="28" r="8" fill="#cbd5e1"/>
        <line x1="-40" y1="32" x2="-55" y2="32" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>
    
            </g>
            
            <!-- Step label & caption -->
            <text x="120" y="176" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">Zeminde Düz Sırtüstü</text>
            <text x="120" y="195" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Bel çukuru yere kilitli, eller kalça yanında</text>
        </g>
        

            <g transform="translate(253, 105)">
                <circle cx="8" cy="0" r="9" fill="#1e293b" stroke="#334155" stroke-width="1"/>
                <path d="M6,-3 L10,0 L6,3" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            

        <g transform="translate(270, 10)">
            <!-- Card background -->
            <rect width="240" height="210" rx="10" fill="#131c2e" stroke="#25334d" stroke-width="1.5"/>
            <!-- Badge -->
            <rect x="12" y="10" width="105" height="22" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
            <text x="64" y="25" fill="#f59e0b" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">2. ARA GEÇİŞ</text>
            
            <!-- Graphic canvas area -->
            <g transform="translate(120, 95)">
                
        <line x1="-75" y1="35" x2="75" y2="35" stroke="#334155" stroke-width="2" stroke-dasharray="4,4" stroke-linecap="round"/>
        <line x1="-15" y1="32" x2="30" y2="32" stroke="url(#bodyGrad)" stroke-width="10" stroke-linecap="round"/>
        <circle cx="38" cy="28" r="8" fill="#cbd5e1"/>
        <line x1="-15" y1="32" x2="-45" y2="5" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
        <path d="M-40,28 Q-48,22 -44,10" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowGold)" fill="none"/>
    
            </g>
            
            <!-- Step label & caption -->
            <text x="120" y="176" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">Bacakları 60° Kaldırma</text>
            <text x="120" y="195" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Dizler düz, karın kasıyla yukarı çekiş</text>
        </g>
        

            <g transform="translate(511, 105)">
                <circle cx="8" cy="0" r="9" fill="#1e293b" stroke="#334155" stroke-width="1"/>
                <path d="M6,-3 L10,0 L6,3" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            

        <g transform="translate(528, 10)">
            <!-- Card background -->
            <rect width="240" height="210" rx="10" fill="#131c2e" stroke="#25334d" stroke-width="1.5"/>
            <!-- Badge -->
            <rect x="12" y="10" width="105" height="22" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
            <text x="64" y="25" fill="#10b981" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">3. SON BİTİRİŞ</text>
            
            <!-- Graphic canvas area -->
            <g transform="translate(120, 95)">
                
        <line x1="-75" y1="35" x2="75" y2="35" stroke="#334155" stroke-width="2" stroke-dasharray="4,4" stroke-linecap="round"/>
        <line x1="-15" y1="32" x2="30" y2="32" stroke="#10b981" stroke-width="10" stroke-linecap="round"/>
        <circle cx="38" cy="28" r="8" fill="#cbd5e1"/>
        <line x1="-15" y1="32" x2="-55" y2="22" stroke="#10b981" stroke-width="7" stroke-linecap="round"/>
        <path d="M-45,12 L-45,20" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
    
            </g>
            
            <!-- Step label & caption -->
            <text x="120" y="176" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">Yavaş İndiriş (Topuk 5 cm)</text>
            <text x="120" y="195" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Yere değmeden dur, beli yerden kaldırma</text>
        </g>
        
</svg>