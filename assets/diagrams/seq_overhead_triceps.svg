<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="100%" height="auto" style="background:#090d16; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
<defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fbbf24"/>
        <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <marker id="arrowCyan" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGold" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#10b981"/>
    </marker>
</defs>

    <!-- PANEL 1: BAŞÜSTÜ DİK KİLİT -->
    <g transform="translate(12, 10)">
        <rect width="240" height="210" rx="10" fill="#131c2e" stroke="#25334d" stroke-width="1.5"/>
        <rect x="12" y="10" width="105" height="22" rx="4" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
        <text x="64" y="25" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">1. BAŞÜSTÜ KİLİT</text>
        <g transform="translate(120, 95)">
            <line x1="-65" y1="48" x2="65" y2="48" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>
            <line x1="-8" y1="45" x2="-8" y2="15" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
            <line x1="8" y1="45" x2="8" y2="15" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
            <line x1="0" y1="15" x2="0" y2="-15" stroke="url(#bodyGrad)" stroke-width="11" stroke-linecap="round"/>
            <circle cx="0" cy="-26" r="8" fill="#cbd5e1"/>
            <!-- Arms extended straight overhead -->
            <line x1="-6" y1="-12" x2="-2" y2="-42" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
            <!-- Single heavy dumbbell overhead -->
            <g transform="translate(-2,-44) scale(0.9)">
                <rect x="-8" y="-2" width="16" height="4" rx="1" fill="#fde68a"/>
                <rect x="-12" y="-7" width="5" height="14" rx="1.5" fill="url(#goldGrad)"/>
                <rect x="7" y="-7" width="5" height="14" rx="1.5" fill="url(#goldGrad)"/>
            </g>
        </g>
        <text x="120" y="176" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">Başüstünde Dikey Kilit</text>
        <text x="120" y="195" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Dirsekler kulağa yakın, bel düz</text>
    </g>

    <!-- ARROW 1 -->
    <g transform="translate(253, 105)">
        <circle cx="8" cy="0" r="9" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <path d="M6,-3 L10,0 L6,3" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- PANEL 2: ENSEYE İNİŞ &amp; UZUN BAŞ ESNEMESİ -->
    <g transform="translate(270, 10)">
        <rect width="240" height="210" rx="10" fill="#131c2e" stroke="#25334d" stroke-width="1.5"/>
        <rect x="12" y="10" width="105" height="22" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
        <text x="64" y="25" fill="#10b981" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">2. DERİN ESNEME</text>
        <g transform="translate(120, 95)">
            <line x1="-65" y1="48" x2="65" y2="48" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>
            <line x1="-8" y1="45" x2="-8" y2="15" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
            <line x1="8" y1="45" x2="8" y2="15" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
            <line x1="0" y1="15" x2="0" y2="-15" stroke="url(#bodyGrad)" stroke-width="11" stroke-linecap="round"/>
            <circle cx="0" cy="-26" r="8" fill="#cbd5e1"/>
            <!-- Upper arm stays high near ear -->
            <line x1="-6" y1="-12" x2="-2" y2="-38" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
            <!-- Forearm bends backwards behind neck -->
            <line x1="-2" y1="-38" x2="-18" y2="-22" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
            <circle cx="-10" cy="-30" r="5" fill="#10b981" fill-opacity="0.7"/>
            <!-- Dumbbell behind head -->
            <g transform="translate(-18,-20) rotate(-45) scale(0.9)">
                <rect x="-8" y="-2" width="16" height="4" rx="1" fill="#fde68a"/>
                <rect x="-12" y="-7" width="5" height="14" rx="1.5" fill="url(#goldGrad)"/>
                <rect x="7" y="-7" width="5" height="14" rx="1.5" fill="url(#goldGrad)"/>
            </g>
            <path d="M2,-42 A22,22 0 0,1 -14,-16" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowGold)"/>
        </g>
        <text x="120" y="176" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">Uzun Baş Maksimum Esneme</text>
        <text x="120" y="195" fill="#10b981" font-size="10" font-weight="600" text-anchor="middle">Dirsekler açılmadan dambılı enseye indir</text>
    </g>

    <!-- ARROW 2 -->
    <g transform="translate(511, 105)">
        <circle cx="8" cy="0" r="9" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <path d="M6,-3 L10,0 L6,3" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- PANEL 3: TRICEPS SIKARAK DİK PRESLENME -->
    <g transform="translate(528, 10)">
        <rect width="240" height="210" rx="10" fill="#131c2e" stroke="#25334d" stroke-width="1.5"/>
        <rect x="12" y="10" width="105" height="22" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
        <text x="64" y="25" fill="#10b981" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">3. TAVANA PRES</text>
        <g transform="translate(120, 95)">
            <line x1="-65" y1="48" x2="65" y2="48" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>
            <line x1="-8" y1="45" x2="-8" y2="15" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
            <line x1="8" y1="45" x2="8" y2="15" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
            <line x1="0" y1="15" x2="0" y2="-15" stroke="url(#bodyGrad)" stroke-width="11" stroke-linecap="round"/>
            <circle cx="0" cy="-26" r="8" fill="#cbd5e1"/>
            <line x1="-6" y1="-12" x2="-2" y2="-42" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
            <path d="M-18,-18 A22,22 0 0,0 -2,-42" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
            <g transform="translate(-2,-44) scale(0.9)">
                <rect x="-8" y="-2" width="16" height="4" rx="1" fill="#fde68a"/>
                <rect x="-12" y="-7" width="5" height="14" rx="1.5" fill="url(#goldGrad)"/>
                <rect x="7" y="-7" width="5" height="14" rx="1.5" fill="url(#goldGrad)"/>
            </g>
        </g>
        <text x="120" y="176" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">Triceps Uzun Baş Kilitlenmesi</text>
        <text x="120" y="195" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Zirvede arka kolu sık, dirseği sabitle</text>
    </g>
</svg>