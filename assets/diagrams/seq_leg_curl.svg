<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="100%" height="auto" style="background:#090d16; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
<defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fbbf24"/>
        <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <marker id="arrowCyan" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGold" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#10b981"/>
    </marker>
</defs>

    <!-- PANEL 1: YATAY ESNEME -->
    <g transform="translate(12, 10)">
        <rect width="240" height="210" rx="10" fill="#131c2e" stroke="#25334d" stroke-width="1.5"/>
        <rect x="12" y="10" width="105" height="22" rx="4" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
        <text x="64" y="25" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">1. DÜZ ESNEME</text>
        <g transform="translate(120, 95)">
            <!-- Bench -->
            <rect x="-75" y="28" width="110" height="8" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/>
            <line x1="-60" y1="36" x2="-60" y2="50" stroke="#1e293b" stroke-width="4"/>
            <line x1="15" y1="36" x2="15" y2="50" stroke="#1e293b" stroke-width="4"/>
            <!-- Torso lying flat -->
            <line x1="-65" y1="20" x2="-5" y2="20" stroke="url(#bodyGrad)" stroke-width="10" stroke-linecap="round"/>
            <circle cx="-75" cy="18" r="8" fill="#cbd5e1"/>
            <!-- Legs extended straight -->
            <line x1="-5" y1="20" x2="35" y2="20" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
            <line x1="35" y1="20" x2="70" y2="20" stroke="#64748b" stroke-width="5.5" stroke-linecap="round"/>
            <!-- Dumbbell between feet -->
            <g transform="translate(70,20) scale(0.85)">
                <rect x="-2.5" y="-8" width="5" height="16" rx="1" fill="#fde68a"/>
                <rect x="-6.5" y="-12" width="13" height="5" rx="1.5" fill="url(#goldGrad)"/>
                <rect x="-6.5" y="7" width="13" height="5" rx="1.5" fill="url(#goldGrad)"/>
            </g>
        </g>
        <text x="120" y="176" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">Yüzüstü Tam Açılış</text>
        <text x="120" y="195" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Bacaklar düz, kalça mindere kilitli</text>
    </g>

    <!-- ARROW 1 -->
    <g transform="translate(253, 105)">
        <circle cx="8" cy="0" r="9" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <path d="M6,-3 L10,0 L6,3" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- PANEL 2: DİZ BÜKME (TEPE KİLİT) -->
    <g transform="translate(270, 10)">
        <rect width="240" height="210" rx="10" fill="#131c2e" stroke="#25334d" stroke-width="1.5"/>
        <rect x="12" y="10" width="105" height="22" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
        <text x="64" y="25" fill="#10b981" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">2. DİZ BÜKME</text>
        <g transform="translate(120, 95)">
            <rect x="-75" y="28" width="110" height="8" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/>
            <line x1="-60" y1="36" x2="-60" y2="50" stroke="#1e293b" stroke-width="4"/>
            <line x1="15" y1="36" x2="15" y2="50" stroke="#1e293b" stroke-width="4"/>
            <line x1="-65" y1="20" x2="-5" y2="20" stroke="url(#bodyGrad)" stroke-width="10" stroke-linecap="round"/>
            <circle cx="-75" cy="18" r="8" fill="#cbd5e1"/>
            <!-- Upper leg on bench -->
            <line x1="-5" y1="20" x2="30" y2="20" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
            <!-- Lower leg flexed upward 90-100 deg -->
            <line x1="30" y1="20" x2="22" y2="-18" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
            <!-- Hamstring peak circle -->
            <circle cx="14" cy="8" r="5" fill="#10b981" fill-opacity="0.7"/>
            <!-- Dumbbell at feet -->
            <g transform="translate(22,-18) scale(0.85)">
                <rect x="-2.5" y="-8" width="5" height="16" rx="1" fill="#fde68a"/>
                <rect x="-6.5" y="-12" width="13" height="5" rx="1.5" fill="url(#goldGrad)"/>
                <rect x="-6.5" y="7" width="13" height="5" rx="1.5" fill="url(#goldGrad)"/>
            </g>
            <!-- Arc arrow -->
            <path d="M65,15 A35,35 0 0,0 28,-10" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
        </g>
        <text x="120" y="176" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">Hamstring Tepe Kasıntısı</text>
        <text x="120" y="195" fill="#10b981" font-size="10" font-weight="600" text-anchor="middle">Kalça kalkmadan topukları kalçaya çek</text>
    </g>

    <!-- ARROW 2 -->
    <g transform="translate(511, 105)">
        <circle cx="8" cy="0" r="9" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <path d="M6,-3 L10,0 L6,3" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- PANEL 3: YAVAŞ AÇILIŞ -->
    <g transform="translate(528, 10)">
        <rect width="240" height="210" rx="10" fill="#131c2e" stroke="#25334d" stroke-width="1.5"/>
        <rect x="12" y="10" width="105" height="22" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
        <text x="64" y="25" fill="#f59e0b" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">3. NEGATİF İNİŞ</text>
        <g transform="translate(120, 95)">
            <rect x="-75" y="28" width="110" height="8" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/>
            <line x1="-60" y1="36" x2="-60" y2="50" stroke="#1e293b" stroke-width="4"/>
            <line x1="15" y1="36" x2="15" y2="50" stroke="#1e293b" stroke-width="4"/>
            <line x1="-65" y1="20" x2="-5" y2="20" stroke="url(#bodyGrad)" stroke-width="10" stroke-linecap="round"/>
            <circle cx="-75" cy="18" r="8" fill="#cbd5e1"/>
            <line x1="-5" y1="20" x2="30" y2="20" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
            <line x1="30" y1="20" x2="52" y2="2" stroke="#94a3b8" stroke-width="5.5" stroke-linecap="round"/>
            <!-- Down arrow -->
            <path d="M26,-10 A35,35 0 0,1 58,10" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowGold)"/>
            <g transform="translate(52,2) scale(0.85)">
                <rect x="-2.5" y="-8" width="5" height="16" rx="1" fill="#fde68a"/>
                <rect x="-6.5" y="-12" width="13" height="5" rx="1.5" fill="url(#goldGrad)"/>
                <rect x="-6.5" y="7" width="13" height="5" rx="1.5" fill="url(#goldGrad)"/>
            </g>
        </g>
        <text x="120" y="176" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">3 Saniye Kontrollü Düzleşme</text>
        <text x="120" y="195" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Hamstringi boşaltmadan gerilimle indir</text>
    </g>
</svg>