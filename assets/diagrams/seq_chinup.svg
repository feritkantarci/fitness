<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="100%" height="auto" style="background:#090d16; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
<defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fbbf24"/>
        <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <marker id="arrowCyan" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGold" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#10b981"/>
    </marker>
</defs>

    <!-- PANEL 1 -->
    <g transform="translate(12, 10)">
        <rect width="240" height="210" rx="10" fill="#131c2e" stroke="#25334d" stroke-width="1.5"/>
        <rect x="12" y="10" width="115" height="22" rx="4" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
        <text x="69" y="25" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">1. TERS ASILMA</text>
        <g transform="translate(120, 85)">
            <!-- Bar -->
            <line x1="-55" y1="-30" x2="55" y2="-30" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
            <!-- Arms straight up, underhand grip -->
            <line x1="-12" y1="-30" x2="-8" y2="-2" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
            <line x1="12" y1="-30" x2="8" y2="-2" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
            <!-- Head & Torso -->
            <circle cx="0" cy="-6" r="7.5" fill="#cbd5e1"/>
            <line x1="0" y1="2" x2="0" y2="34" stroke="url(#bodyGrad)" stroke-width="9" stroke-linecap="round"/>
            <!-- Crossed legs -->
            <polyline points="0,34 -4,54 0,66" stroke="#64748b" stroke-width="5" stroke-linecap="round" fill="none"/>
            <polyline points="0,34 4,54 0,66" stroke="#64748b" stroke-width="5" stroke-linecap="round" fill="none"/>
        </g>
        <text x="120" y="176" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">Ters Tutuş &amp; Asılma</text>
        <text x="120" y="195" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Avuçlar yüze dönük, omuz genişliği</text>
    </g>

    <!-- TRANSITION 1 -->
    <g transform="translate(253, 105)">
        <circle cx="8" cy="0" r="9" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <path d="M6,-3 L10,0 L6,3" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- PANEL 2 -->
    <g transform="translate(270, 10)">
        <rect width="240" height="210" rx="10" fill="#131c2e" stroke="#25334d" stroke-width="1.5"/>
        <rect x="12" y="10" width="115" height="22" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
        <text x="69" y="25" fill="#f59e0b" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">2. BICEPS ÇEKİŞİ</text>
        <g transform="translate(120, 85)">
            <!-- Bar -->
            <line x1="-55" y1="-30" x2="55" y2="-30" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
            <!-- Arms flexing, elbows down -->
            <polyline points="-12,-30 -18,-14 -6,-2" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" fill="none"/>
            <polyline points="12,-30 18,-14 6,-2" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" fill="none"/>
            <!-- Head & Torso rising -->
            <circle cx="0" cy="-14" r="7.5" fill="#cbd5e1"/>
            <line x1="0" y1="-6" x2="0" y2="26" stroke="url(#bodyGrad)" stroke-width="9" stroke-linecap="round"/>
            <!-- Crossed legs -->
            <polyline points="0,26 -4,46 0,58" stroke="#64748b" stroke-width="5" stroke-linecap="round" fill="none"/>
            <polyline points="0,26 4,46 0,58" stroke="#64748b" stroke-width="5" stroke-linecap="round" fill="none"/>
            <!-- Arrow up -->
            <path d="M0,15 L0,-2" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowGold)"/>
        </g>
        <text x="120" y="176" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">Pazu &amp; Kanatla Yükseliş</text>
        <text x="120" y="195" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Dirsekleri kaburgaya çek, göğsü bara sür</text>
    </g>

    <!-- TRANSITION 2 -->
    <g transform="translate(511, 105)">
        <circle cx="8" cy="0" r="9" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <path d="M6,-3 L10,0 L6,3" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- PANEL 3 -->
    <g transform="translate(528, 10)">
        <rect width="240" height="210" rx="10" fill="#131c2e" stroke="#25334d" stroke-width="1.5"/>
        <rect x="12" y="10" width="115" height="22" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
        <text x="69" y="25" fill="#10b981" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">3. ÇENE ÜSTÜ KİLİT</text>
        <g transform="translate(120, 85)">
            <!-- Bar -->
            <line x1="-55" y1="-30" x2="55" y2="-30" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
            <!-- Arms fully flexed tight at shoulders -->
            <polyline points="-12,-30 -16,-26 -6,-24" stroke="#10b981" stroke-width="4" stroke-linecap="round" fill="none"/>
            <polyline points="12,-30 16,-26 6,-24" stroke="#10b981" stroke-width="4" stroke-linecap="round" fill="none"/>
            <!-- Head ABOVE bar -->
            <circle cx="0" cy="-38" r="7.5" fill="#cbd5e1"/>
            <line x1="0" y1="-30" x2="0" y2="4" stroke="#10b981" stroke-width="9" stroke-linecap="round"/>
            <!-- Crossed legs -->
            <polyline points="0,4 -4,24 0,36" stroke="#64748b" stroke-width="5" stroke-linecap="round" fill="none"/>
            <polyline points="0,4 4,24 0,36" stroke="#64748b" stroke-width="5" stroke-linecap="round" fill="none"/>
            <circle cx="0" cy="-38" r="14" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="2,2"/>
        </g>
        <text x="120" y="176" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">Çene Barın Üstünde</text>
        <text x="120" y="195" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Tepe kasılma, biceps ve alt kanat kilit</text>
    </g>
</svg>
