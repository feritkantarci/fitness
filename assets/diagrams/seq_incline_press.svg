<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="100%" height="auto" style="background:#090d16; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
<defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fbbf24"/>
        <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <marker id="arrowCyan" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGold" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#10b981"/>
    </marker>
</defs>

    <!-- PANEL 1: 30 DERECE SEHPA KURULUM -->
    <g transform="translate(12, 10)">
        <rect width="240" height="210" rx="10" fill="#131c2e" stroke="#25334d" stroke-width="1.5"/>
        <rect x="12" y="10" width="105" height="22" rx="4" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
        <text x="64" y="25" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">1. 30° SEHPA</text>
        <g transform="translate(120, 95)">
            <!-- 30 deg incline bench -->
            <line x1="-50" y1="25" x2="20" y2="-15" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
            <line x1="-50" y1="25" x2="-65" y2="45" stroke="#1e293b" stroke-width="4"/>
            <!-- Body lying on incline -->
            <line x1="-40" y1="20" x2="15" y2="-12" stroke="url(#bodyGrad)" stroke-width="10" stroke-linecap="round"/>
            <circle cx="22" cy="-18" r="8" fill="#cbd5e1"/>
            <!-- Leg planted -->
            <polyline points="-40,20 -30,35 -20,48" stroke="#64748b" stroke-width="5" stroke-linecap="round" fill="none"/>
            <!-- Arm bent holding dumbbell at chest -->
            <line x1="-5" y1="2" x2="10" y2="16" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
            <g transform="translate(10,14) rotate(45) scale(0.85)">
                <rect x="-8" y="-2" width="16" height="4" rx="1" fill="#fde68a"/>
                <rect x="-12" y="-6" width="5" height="12" rx="1.5" fill="url(#goldGrad)"/>
                <rect x="7" y="-6" width="5" height="12" rx="1.5" fill="url(#goldGrad)"/>
            </g>
        </g>
        <text x="120" y="176" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">Köprücük Kemiğinde Başlangıç</text>
        <text x="120" y="195" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Dirsekler 45° ok açısında, göğüs açık</text>
    </g>

    <!-- ARROW 1 -->
    <g transform="translate(253, 105)">
        <circle cx="8" cy="0" r="9" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <path d="M6,-3 L10,0 L6,3" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- PANEL 2: TAVANA İTİŞ &amp; ÜST GÖĞÜS KİLİDİ -->
    <g transform="translate(270, 10)">
        <rect width="240" height="210" rx="10" fill="#131c2e" stroke="#25334d" stroke-width="1.5"/>
        <rect x="12" y="10" width="105" height="22" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
        <text x="64" y="25" fill="#10b981" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">2. DİKEY İTİŞ</text>
        <g transform="translate(120, 95)">
            <line x1="-50" y1="25" x2="20" y2="-15" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
            <line x1="-40" y1="20" x2="15" y2="-12" stroke="url(#bodyGrad)" stroke-width="10" stroke-linecap="round"/>
            <circle cx="22" cy="-18" r="8" fill="#cbd5e1"/>
            <polyline points="-40,20 -30,35 -20,48" stroke="#64748b" stroke-width="5" stroke-linecap="round" fill="none"/>
            <!-- Arm pressed straight up perpendicular to ceiling -->
            <line x1="-5" y1="2" x2="-5" y2="-30" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
            <circle cx="5" cy="-8" r="4.5" fill="#10b981" fill-opacity="0.7"/>
            <g transform="translate(-5,-32) scale(0.85)">
                <rect x="-8" y="-2" width="16" height="4" rx="1" fill="#fde68a"/>
                <rect x="-12" y="-6" width="5" height="12" rx="1.5" fill="url(#goldGrad)"/>
                <rect x="7" y="-6" width="5" height="12" rx="1.5" fill="url(#goldGrad)"/>
            </g>
            <path d="M8,12 L-2,-24" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
        </g>
        <text x="120" y="176" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">Üst Göğüs Tepe Sıkışması</text>
        <text x="120" y="195" fill="#10b981" font-size="10" font-weight="600" text-anchor="middle">Dambılları çarpmadan tavana kilitle</text>
    </g>

    <!-- ARROW 2 -->
    <g transform="translate(511, 105)">
        <circle cx="8" cy="0" r="9" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <path d="M6,-3 L10,0 L6,3" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- PANEL 3: NEGATİF İNİŞ -->
    <g transform="translate(528, 10)">
        <rect width="240" height="210" rx="10" fill="#131c2e" stroke="#25334d" stroke-width="1.5"/>
        <rect x="12" y="10" width="105" height="22" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
        <text x="64" y="25" fill="#f59e0b" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">3. NEGATİF İNİŞ</text>
        <g transform="translate(120, 95)">
            <line x1="-50" y1="25" x2="20" y2="-15" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
            <line x1="-40" y1="20" x2="15" y2="-12" stroke="url(#bodyGrad)" stroke-width="10" stroke-linecap="round"/>
            <circle cx="22" cy="-18" r="8" fill="#cbd5e1"/>
            <polyline points="-40,20 -30,35 -20,48" stroke="#64748b" stroke-width="5" stroke-linecap="round" fill="none"/>
            <line x1="-5" y1="2" x2="6" y2="-14" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M-2,-24 L10,4" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowGold)"/>
            <g transform="translate(6,-14) rotate(35) scale(0.85)">
                <rect x="-8" y="-2" width="16" height="4" rx="1" fill="#fde68a"/>
                <rect x="-12" y="-6" width="5" height="12" rx="1.5" fill="url(#goldGrad)"/>
                <rect x="7" y="-6" width="5" height="12" rx="1.5" fill="url(#goldGrad)"/>
            </g>
        </g>
        <text x="120" y="176" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">3 Saniye Kontrollü İniş</text>
        <text x="120" y="195" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Omuz kapsülünü koru, göğsü esnet</text>
    </g>
</svg>