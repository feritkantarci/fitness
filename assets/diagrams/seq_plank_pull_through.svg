            <g transform="translate(120, 95)">
                
        <line x1="-75" y1="35" x2="75" y2="35" stroke="#334155" stroke-width="2" stroke-dasharray="4,4" stroke-linecap="round"/>
        <line x1="-50" y1="33" x2="20" y2="12" stroke="#10b981" stroke-width="10" stroke-linecap="round"/>
        <circle cx="28" cy="8" r="8" fill="#cbd5e1"/>
        <line x1="16" y1="14" x2="16" y2="33" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
        <circle cx="-12" cy="18" r="14" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="2,2"/>
        <g transform="translate(-16,33) rotate(90) scale(1.0)">
        <rect x="-8" y="-2.5" width="16" height="5" rx="1.5" fill="#fde68a"/>
        <rect x="-13" y="-7" width="5.5" height="14" rx="2" fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.5"/>
        <rect x="7.5" y="-7" width="5.5" height="14" rx="2" fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.5"/>
    </g>
    
            </g>
            <text x="120" y="176" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">Karşı Tarafa Bırakış</text>
            <text x="120" y="195" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Kalça hiç oynamadan sabit durur</text>
