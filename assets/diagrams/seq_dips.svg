<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="100%" height="auto" style="background:#090d16; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
<defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fbbf24"/>
        <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <marker id="arrowCyan" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGold" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#10b981"/>
    </marker>
</defs>

    <!-- PANEL 1: ASILMA &amp; 30 DERECE EĞİM -->
    <g transform="translate(12, 10)">
        <rect width="240" height="210" rx="10" fill="#131c2e" stroke="#25334d" stroke-width="1.5"/>
        <rect x="12" y="10" width="105" height="22" rx="4" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
        <text x="64" y="25" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">1. KİLİTLENME</text>
        <g transform="translate(120, 95)">
            <!-- Parallel bar -->
            <line x1="-45" y1="8" x2="45" y2="8" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
            <line x1="-30" y1="8" x2="-30" y2="50" stroke="#1e293b" stroke-width="5"/>
            <line x1="30" y1="8" x2="30" y2="50" stroke="#1e293b" stroke-width="5"/>
            <!-- Body locked tall -->
            <line x1="-5" y1="10" x2="5" y2="-22" stroke="url(#bodyGrad)" stroke-width="11" stroke-linecap="round"/>
            <circle cx="10" cy="-34" r="8" fill="#cbd5e1"/>
            <!-- Arms locked straight on bars -->
            <line x1="0" y1="-15" x2="-12" y2="8" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
            <!-- Legs bent at knee -->
            <polyline points="-5,10 -15,28 -8,40" stroke="#64748b" stroke-width="5" stroke-linecap="round" fill="none"/>
        </g>
        <text x="120" y="176" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">Paralel Barlarda Asılma</text>
        <text x="120" y="195" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Kollar düz, gövde 30° öne eğik</text>
    </g>

    <!-- ARROW 1 -->
    <g transform="translate(253, 105)">
        <circle cx="8" cy="0" r="9" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <path d="M6,-3 L10,0 L6,3" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- PANEL 2: DERİN DİP İNİŞİ &amp; GÖĞÜS ESNEMESİ -->
    <g transform="translate(270, 10)">
        <rect width="240" height="210" rx="10" fill="#131c2e" stroke="#25334d" stroke-width="1.5"/>
        <rect x="12" y="10" width="105" height="22" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
        <text x="64" y="25" fill="#10b981" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">2. DİP İNİŞ</text>
        <g transform="translate(120, 95)">
            <line x1="-45" y1="8" x2="45" y2="8" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
            <line x1="-30" y1="8" x2="-30" y2="50" stroke="#1e293b" stroke-width="5"/>
            <line x1="30" y1="8" x2="30" y2="50" stroke="#1e293b" stroke-width="5"/>
            <!-- Body descended low -->
            <line x1="-5" y1="25" x2="10" y2="-2" stroke="url(#bodyGrad)" stroke-width="11" stroke-linecap="round"/>
            <circle cx="16" cy="-12" r="8" fill="#cbd5e1"/>
            <!-- Elbow bent 90 deg above hands -->
            <polyline points="6,-2 -8,-4 -12,8" stroke="#10b981" stroke-width="5" stroke-linecap="round" fill="none"/>
            <circle cx="2" cy="10" r="5" fill="#10b981" fill-opacity="0.7"/>
            <polyline points="-5,25 -15,40 -8,50" stroke="#64748b" stroke-width="5" stroke-linecap="round" fill="none"/>
            <path d="M-2,-14 L-2,14" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowGold)"/>
        </g>
        <text x="120" y="176" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">Alt Göğüs Derin Esnemesi</text>
        <text x="120" y="195" fill="#10b981" font-size="10" font-weight="600" text-anchor="middle">Dirsekler 90°, omuzları göğse aç</text>
    </g>

    <!-- ARROW 2 -->
    <g transform="translate(511, 105)">
        <circle cx="8" cy="0" r="9" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <path d="M6,-3 L10,0 L6,3" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- PANEL 3: PATLAYICI İTİŞ &amp; TEPE KİLİTLENME -->
    <g transform="translate(528, 10)">
        <rect width="240" height="210" rx="10" fill="#131c2e" stroke="#25334d" stroke-width="1.5"/>
        <rect x="12" y="10" width="105" height="22" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
        <text x="64" y="25" fill="#10b981" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">3. GÜÇLÜ İTİŞ</text>
        <g transform="translate(120, 95)">
            <line x1="-45" y1="8" x2="45" y2="8" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
            <line x1="-30" y1="8" x2="-30" y2="50" stroke="#1e293b" stroke-width="5"/>
            <line x1="30" y1="8" x2="30" y2="50" stroke="#1e293b" stroke-width="5"/>
            <line x1="-5" y1="10" x2="5" y2="-22" stroke="url(#bodyGrad)" stroke-width="11" stroke-linecap="round"/>
            <circle cx="10" cy="-34" r="8" fill="#cbd5e1"/>
            <line x1="0" y1="-15" x2="-12" y2="8" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
            <polyline points="-5,10 -15,28 -8,40" stroke="#64748b" stroke-width="5" stroke-linecap="round" fill="none"/>
            <path d="M-18,24 L-18,-8" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
        </g>
        <text x="120" y="176" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">Alt Göğüs ve Triceps Kilit</text>
        <text x="120" y="195" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Zirvede alt göğsü sıkarak barları it</text>
    </g>
</svg>